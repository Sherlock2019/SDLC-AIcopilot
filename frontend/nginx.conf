server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
  location = /health { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
