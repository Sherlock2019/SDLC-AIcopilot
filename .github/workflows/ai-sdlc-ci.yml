name: ai-sdlc-ci

# Quality gates for AI-assisted change:
#   tests pass · coverage > 80% · no CRITICAL security finding · AI evaluation > 80% · no policy violation
#
# This workflow never deploys to a real environment. The last job only simulates staging.
# It needs no secrets: everything runs with MOCK_AI=true.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MOCK_AI: "true"
  GITHUB_ENABLED: "false"

jobs:
  quality:
    name: Lint, tests, security, AI evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Unit tests (policy, security, context, evaluation)
        run: pytest tests/test_policy_critical.py tests/test_security_and_context.py --cov=app --cov-report=

      - name: Integration tests (full SDLC journey)
        run: pytest tests/test_workflow_integration.py --cov=app --cov-append --cov-report=xml --cov-report=term

      - name: Sample application tests
        working-directory: sample_app
        run: pytest -q

      - name: Security scan (static rules + secrets)
        run: python -m app.cli security-scan

      - name: Capability and escape-path audit (no policy violation)
        run: python -m app.cli audit-capabilities

      - name: Red-team suite (mocks only)
        run: LAB_DATA_DIR="$RUNNER_TEMP/redteam" python -m app.cli red-team

      - name: AI evaluation (score must be above 80%)
        run: python -m app.cli evaluate --min-score 80

      - name: Coverage check (must be above 80%)
        run: coverage report --fail-under=80

  frontend:
    name: Build UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [quality, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (API)
        run: docker build -f backend/Dockerfile -t ai-sdlc-lab-api:${{ github.sha }} .
      - name: Build Docker image (UI)
        run: docker build -t ai-sdlc-lab-ui:${{ github.sha }} frontend

  staging:
    name: SIMULATE_STAGING_DEPLOYMENT
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Simulate promotion DEV -> TEST -> STAGING
        run: |
          for env in DEV TEST STAGING; do echo "SIMULATE_STAGING_DEPLOYMENT $env ok (${GITHUB_SHA::7})"; done
          echo "PRODUCTION is never deployed by this workflow. It requires manual human approval."
