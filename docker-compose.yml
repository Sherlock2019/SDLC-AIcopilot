# AI-SDLC Champion Lab
#   docker compose up
#   UI        http://localhost:3000
#   API       http://localhost:8000
#   API docs  http://localhost:8000/docs
#
# Works with no .env file and no API keys (MOCK_AI=true).
# If a port is taken:  API_PORT=8010 UI_PORT=3010 docker compose up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only   # local demo database, not a secret
      POSTGRES_DB: lab
    volumes:
      - lab-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lab:lab-local-only@db:5432/lab}  # allow-secret: local demo database
      MOCK_AI: ${MOCK_AI:-true}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-}
      GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - lab-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${UI_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lab-db:
  lab-data:
