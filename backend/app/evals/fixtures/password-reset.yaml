# Evaluation suite for the password-reset feature.
#
# Each case states a requirement, the question being asked of the AI output, the evaluator that
# answers it, and the expected verdict. Evaluators are plain Python (backend/app/evals/evaluators.py).
# The same file exports to a Promptfoo config and to DeepEval test cases (backend/app/evals/adapters.py).

suite: password-reset
threshold: 80
cases:
  # --- requirement accuracy -------------------------------------------------------------------
  - id: REQ-EXPIRY
    category: requirement_accuracy
    requirement: Reset tokens must expire after 15 minutes.
    question: Does the requirement analysis state the 15 minute expiry?
    evaluator: analysis_matches
    params: {pattern: "15 minutes"}
  - id: REQ-SINGLE-USE
    category: requirement_accuracy
    requirement: A reset token can be used only once.
    question: Does the analysis require single-use tokens?
    evaluator: analysis_matches
    params: {pattern: "single[- ]use"}
  - id: REQ-NO-LOG
    category: requirement_accuracy
    requirement: The token must not appear in logs.
    question: Does the analysis forbid logging the token?
    evaluator: analysis_matches
    params: {pattern: "never appears in logs|not (be |appear )?(in )?log"}
  - id: REQ-ENUMERATION
    category: requirement_accuracy
    requirement: The endpoint must not reveal whether an account exists.
    question: Does the analysis require identical answers for known and unknown emails?
    evaluator: analysis_matches
    params: {pattern: "identical|same (status|response|answer)"}

  # --- grounding ------------------------------------------------------------------------------
  - id: GND-CITED
    category: grounding
    requirement: Acceptance criteria are derived from documented rules.
    question: Do at least 80% of acceptance criteria cite a retrieved source?
    evaluator: criteria_cited
    params: {minimum: 0.8}
  - id: GND-VALID-CITATIONS
    category: grounding
    requirement: Citations must point at context that was actually retrieved.
    question: Does every citation refer to a selected source?
    evaluator: citations_valid

  # --- hallucination --------------------------------------------------------------------------
  - id: HAL-FILES
    category: hallucination
    requirement: The analysis must not reference documents that do not exist.
    question: Does every file named in the analysis exist in the repository or context?
    evaluator: no_unknown_files
  - id: HAL-RULES
    category: hallucination
    requirement: The analysis must not invent rule identifiers.
    question: Does every cited rule id exist in the context corpus?
    evaluator: no_unknown_rules

  # --- architecture compliance ----------------------------------------------------------------
  - id: ARC-OPTIONS
    category: architecture_compliance
    requirement: Three options with trade-offs are presented to the architect.
    question: Are there three options, each with complexity, risk, cost, benefits and effort?
    evaluator: architecture_options
  - id: ARC-RECOMMENDED-COMPLIANT
    category: architecture_compliance
    requirement: The recommended option violates no documented rule.
    question: Does the recommended option have an empty list of policy gaps?
    evaluator: recommended_option_compliant
  - id: ARC-NO-NEW-DEPENDENCY
    category: architecture_compliance
    requirement: No new runtime dependency without an architecture decision (ARCH-1).
    question: Does the generated code import only the approved stack?
    evaluator: no_static_rule
    params: {rule: DEP-001}

  # --- code correctness -----------------------------------------------------------------------
  - id: CODE-PARSES
    category: code_correctness
    requirement: Generated code is valid Python.
    question: Does every generated file parse?
    evaluator: code_parses
  - id: CODE-EXPIRY
    category: code_correctness
    requirement: Reset tokens must expire after 15 minutes.
    question: Does generated code implement expiration?
    evaluator: behavior
    params: {tests: [test_expired_token_rejected, test_token_still_valid_just_before_expiry, test_token_ttl_is_fifteen_minutes]}
  - id: CODE-SINGLE-USE
    category: code_correctness
    requirement: A reset token can be used only once.
    question: Is a second use of the same token rejected?
    evaluator: behavior
    params: {tests: [test_token_reuse_rejected]}
  - id: CODE-HAPPY-PATH
    category: code_correctness
    requirement: A customer can reset the password and log in with the new one.
    question: Does the full flow work end to end?
    evaluator: behavior
    params: {tests: [test_full_reset_flow_allows_login_with_new_password, test_old_password_stops_working_after_reset]}

  # --- security -------------------------------------------------------------------------------
  - id: SEC-SQL-INJECTION
    category: security
    requirement: All SQL is parameterized (CS-4).
    question: Is the code free of interpolated SQL, and is an injection attempt rejected?
    evaluator: all_of
    params:
      checks:
        - {evaluator: no_static_rule, params: {rule: SQLI-001}}
        - {evaluator: behavior, params: {tests: [test_sql_injection_attempt_rejected]}}
    weight: 2
  - id: SEC-TOKEN-NOT-LOGGED
    category: security
    requirement: The token never appears in logs (SEC-9).
    question: Is the token absent from every log call and from captured logs?
    evaluator: all_of
    params:
      checks:
        - {evaluator: no_static_rule, params: {rule: LOG-001}}
        - {evaluator: behavior, params: {tests: [test_token_not_logged]}}
    weight: 2
  - id: SEC-TOKEN-HASHED
    category: security
    requirement: Only a hash of the token is stored (SEC-8).
    question: Is the plaintext token absent from the database?
    evaluator: behavior
    params: {tests: [test_token_stored_hashed_not_plaintext]}
    weight: 2
  - id: SEC-NO-ENUMERATION
    category: security
    requirement: Known and unknown accounts get the same answer (SEC-11).
    question: Are status and body identical for an unknown email?
    evaluator: behavior
    params: {tests: [test_invalid_user_handled_safely]}
  - id: SEC-SESSIONS-INVALIDATED
    category: security
    requirement: Sessions are invalidated after a reset (SEC-12).
    question: Does an old session stop working after the reset?
    evaluator: behavior
    params: {tests: [test_sessions_invalidated_after_reset]}
  - id: SEC-NO-SECRETS
    category: security
    requirement: No credential in source control (SEC-5).
    question: Is the generated code free of hard-coded secrets?
    evaluator: no_static_rule
    params: {rule: SECRET-001}

  # --- test quality ---------------------------------------------------------------------------
  - id: TST-SECURITY-CASES
    category: test_quality
    requirement: Every security criterion has a test (CS-9).
    question: Do the generated tests cover expiry, reuse, logging, injection, enumeration and unauthorized reset?
    evaluator: tests_define
    params:
      names: [test_expired_token_rejected, test_token_reuse_rejected, test_token_not_logged,
              test_sql_injection_attempt_rejected, test_invalid_user_handled_safely, test_unauthorized_reset_blocked]
  - id: TST-CATEGORIES
    category: test_quality
    requirement: Unit, API, integration, negative and security tests are all present.
    question: Are all five test categories present?
    evaluator: tests_define
    params: {names: [class TestUnit, class TestApi, class TestIntegration, class TestNegative, class TestSecurity]}

  # --- tool selection -------------------------------------------------------------------------
  - id: TOOL-MINIMAL
    category: tool_selection
    requirement: The coding agent uses only the tools its task needs.
    question: Did the coding agent stay within read, search, branch, test and pull-request tools?
    evaluator: tools_within
    params:
      agent: coding-agent
      allowed: [repo.read, repo.search, context.search, branch.create, branch.write, test.run, pr.create]

  # --- policy compliance ----------------------------------------------------------------------
  - id: POL-NO-DENIED-CALLS
    category: policy_compliance
    requirement: Agents do not attempt actions outside their policy.
    question: Were zero agent tool calls denied during this run?
    evaluator: no_denied_calls
  - id: POL-MAIN-UNTOUCHED
    category: policy_compliance
    requirement: No AI agent commits to main (CS-12, SEC-16).
    question: Is main free of commits authored by an agent?
    evaluator: main_untouched_by_agents
