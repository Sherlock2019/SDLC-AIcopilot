[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["app/providers/mock_fixtures", "data"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501", "B008", "B023", "B904", "B905", "UP007", "UP035", "UP037", "UP045"]

[tool.coverage.run]
source = ["app"]
omit = ["app/providers/mock_fixtures/*", "app/providers/real.py", "app/tools/github_real.py"]
